a1:
  candidate_generation:
    config_path: configs/anchors/control_candidate_pool.yaml
  trajectory_weight: 1.0
  control_weight: 1.0
  control_steps: 40
  dt: 0.1
  wheelbase_m: 5.5
  ego_length_m: 8.0
  ego_width_m: 2.6
  max_accel_mps2: 2.5
  max_decel_mps2: 4.0
  max_steer_rad: 0.61
  lane_change_distance_m: 65.0
  road_edge_margin_m: 0.15
  speed_delta_mps: 3.0
  minimum_lane_change_speed_mps: 3.0

# Must match the raw expert collection's road_geometry section. The same
# exporter settings are applied online before A1AnchorBuilder is called.
road_geometry:
  forward_min_m: 120.0
  forward_max_m: 300.0
  point_spacing_m: 1.5
  max_lanes: 16
  max_points_per_lane: 256
