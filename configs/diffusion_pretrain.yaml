model: {}

training:
  dataset_root: outputs/expert_dataset/allmerge_expert
  output_dir: outputs/diffusion_pretrain
  train_split: train
  val_split: val
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: auto
  max_epochs: 50
  max_steps: -1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  min_lr: 1.0e-6
  warmup_epochs: 3
  precision: auto
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  save_top_k: 3
  seed: 0
