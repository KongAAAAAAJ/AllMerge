# Stage B-1 ONLY. Keep configs/koopman.yaml UNMODIFIED during TruckSim collection.
# Path is relative to AllMerge-main project root (all_merge/ on your machine).
# Set roots to the *current* accepted collection output to avoid mixed runs.
data:
  roots:
    - outputs/koopman/data/dynamic_sv_vxs_grid_v1
  accepted_only: true       # only .npz with independently validated .accepted.json
  strict: false             # skip unfinished/corrupt runs while collection continues
  dt_s: 0.1
  history_steps: 5          # 0.5 s state history, 4 past controls
  horizon_steps: 40         # 4 s => predicted states [B,41,5]
  warmup_s: 1.0
  train_stride: 2
  eval_stride: 5
  val_fraction: 0.15        # split by EPISODE, never by overlapping windows
  test_fraction: 0.10

model:
  type: K0
  latent_dim: 32
  hidden_dim: 128

training:
  device: auto              # cpu / cuda / auto
  seed: 2026
  epochs: 60
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 20
  position_scale_m: 5.0
  loss_weights:
    one_step: 0.2
    rollout: 1.0
    reconstruction: 0.1
    trajectory: 0.05
    matrix_regularization: 0.0001

outputs:
  checkpoints: outputs/koopman/checkpoints/k0
