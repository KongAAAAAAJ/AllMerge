# TRACE paper-aligned A0/A1/A2 Anchor Ablation evaluation.
stage: all              # anchors: 4 metrics | feasibility: 2 metrics | all: 6 metrics; no iterative projection
methods: [A0, A1, A2]   # Select one or several methods

anchor_sources:
  a0_bank: outputs/anchor_ablation/ckpt/A0_anchors/A0_control_anchors.npz
  a0_rollout:
    dt: 0.1
    wheelbase_m: 5.5
    max_accel_mps2: 4.0
    max_steer_rad: 0.5
  a2_scorer: outputs/anchor_ablation/ckpt/A2_anchors/best.pt
dataset_root: outputs/expert_dataset/expert_trucksim_50k
split: test
num_frames: 20          # feasibility/all: 多少个场景帧
num_samples: 500        # anchors: 多少个样本
max_samples: null
batch_size: 128
num_workers: 0           # Avoid spawning extra PyTorch/CUDA processes on Windows
device: auto
seeds: "0,1,2"
sample_seed: 2026
figure_scenes: 3        # Distinct frames; rows in the anchor comparison figure
figure_seed: 2027       # Independent of evaluation scores and inference seeds
output_dir: outputs/anchor_ablation/evaluation



# Planning safety is evaluated on the selected raw K2 trajectory before JTP.
planning_safety:
  ttc_threshold_s: 1.0              # TTC compliance threshold; configurable
  closing_speed_epsilon_mps: 0.1   # Ignore near-zero radial closing speeds
  drivable_area_tolerance_m: 1.0e-6
