# TRACE Ablation 3: Joint Trajectory Projection.
# Explicit engineering evaluation settings below are provisional, NOT values
# established by the paper. Freeze and document their calibration for publication.
split: test
num_frames: 100             # 0 means all complete synchronized frames
sample_seed: 2026
seeds: '0,1,2,3,4'
figure_seed: 2027
bootstrap_seed: 2026
bootstrap_repeats: 2000
device: auto
output_dir: outputs/jtp_ablation/evaluation
jtp_config: configs/projection/jtp.yaml
invalid_map_policy: error  # 'skip' only for explicitly reported and audited geometry failures
k2_consistency_tolerance: 0.0001
max_external_actors: 12
max_external_distance_m: 150.0
# These three limits must exactly match configs/projection/jtp.yaml.
limits:
  collision_clearance_m: 0.35
  acceleration_rate_max_mps3: 2.5
  steering_rate_max_rad_s: 0.5
tolerances:
  stability_rad: 0.00001
  ltr: 0.00001
  road_m: 0.0001
  curvature_per_m2: 0.000001
  collision_m: 0.0001
  control_si: 0.00001
