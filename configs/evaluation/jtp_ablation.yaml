# TRACE Ablation 3: Joint Trajectory Projection.
# Explicit engineering evaluation settings below are provisional, NOT values
# established by the paper. Freeze and document their calibration for publication.
split: test
num_frames: 100             # 0 means all complete synchronized frames
sample_seed: 2026
seeds: '0,1,2,3,4'
figure_seed: 2027
bootstrap_seed: 2026
bootstrap_repeats: 2000
device: auto
workers: 1                 # independent frame processes; try 2 on a single GPU
worker_threads: 1          # CPU threads per parallel worker; serial mode unchanged
output_dir: outputs/jtp_ablation/evaluation
jtp_config: configs/projection/jtp.yaml
k2_consistency_tolerance: 0.0001
tolerances:
  stability_rad: 0.01
  ltr: 0.01
  control_si: 0.01
