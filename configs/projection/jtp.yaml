# TRACE Joint Trajectory Projection (JTP): constraints, solver, and live context.
# Provisional values: calibrate only after the projection mechanism is frozen.
execution:
  dt_s: 0.1
  horizon_steps: 40
  control_steps: 40
  wheelbase_m: 5.5

stability:
  gravity_mps2: 9.81
  minimum_mu_for_limits: 0.05
  yaw_rate_safety_factor: 0.85
  minimum_speed_for_yaw_limit_mps: 3.0
  sideslip:
    base_limit_deg: 5.0
    reference_mu: 0.8
    friction_exponent: 0.5
    scale_min: 0.65
    scale_max: 1.15
  roll:
    base_limit_deg: 5.0
    reference_mu: 0.8
    friction_exponent: 0.5
    payload_reference_kg: 10000.0
    payload_sensitivity: 0.20
    scale_min: 0.55
    scale_max: 1.10
  ltr_limit: 0.80

geometry:
  curvature_limit_per_m: 0.025
  road_clearance_m: 0.35
  footprint:
    circle_offsets_m: [-3.0, -1.5, 0.0, 1.5, 3.0]
    circle_radius_m: 1.45

control:
  acceleration_min_mps2: -4.0
  acceleration_max_mps2: 2.5
  steering_min_rad: -0.08
  steering_max_rad: 0.08
  # First differences include the previously applied control at t=0.
  acceleration_rate_max_mps3: 2.5
  steering_rate_max_rad_s: 0.5
  rate_tolerance_si: 0.00001
  # Characteristic scales used to normalize control-space updates.
  trust_scale: [2.5, 0.08]

optimization:
  lambda_u: 0.10
  trajectory_weights: [1.0, 1.0, 0.25]
  control_weights: [0.16, 156.25]

projection:
  # solver_method: damped_least_squares or constrained_qp
  solver_method: constrained_qp
  qp:
    backend: osqp
    control_correction_weight: 1.0
    # Initial values for the first QP smoke test; calibrate from matched-frame diagnostics.
    state_slack:
      linear_penalty: 10.0
      quadratic_penalty: 1.0
    protection_slack:
      linear_penalty: 1000.0
      quadratic_penalty: 100.0
    eps_abs: 1.0e-3
    eps_rel: 1.0e-3
    max_iter: 20000
    polishing: true
    adaptive_rho: true
    verbose: false
  # G1 stability, G2 road/curvature, G3 control-rate.
  constraint_sampling_stride: 4
  protection_max_sweeps: 32
  protection_tolerance: 1.0e-6
  nondegradation_tolerance: 1.0e-6
  max_iterations: 6
  max_stalled_iterations: 3
  max_active_per_group:
    stability: 24
    road: 30
    curvature: 16
    control_rate: 64
  constraint_tolerance: 1.0e-4
  residual_scales:
    stability: [0.5, 0.0872665, 0.0872665, 0.80]
    road_m: 0.5
    curvature_per_m2: 0.000625
    control_rate: [2.5, 0.12]
  violation_weight_beta: 2.0
  damping: 1.0e-4
  damping_retries: 6
  trust_damping_retries: 2
  metric_regularization: 1.0e-5
  initial_trust_radius: 0.25
  minimum_trust_radius: 0.01
  maximum_trust_radius: 0.75
  max_step_norm: 0.20
  trust_shrink_factor: 0.5
  trust_grow_factor: 1.5
  alpha_initial: 1.0
  alpha_minimum: 0.0625
  alpha_shrink_factor: 0.5
  minimum_violation_improvement: 1.0e-6
  change_tolerance: 1.0e-6  # normalized control correction used only for projection-applied diagnostics

# Online K2 history and road-context construction (shared execution above).
runtime:
  context:
    sample_dt_s: 0.1
    max_gap_tolerance_s: 0.02
    history_state_steps: 5
    payload_kg: null       # scalar or per-controlled-vehicle list
    road_mu: null          # scalar or per-controlled-vehicle list, in (0,1]
  road:
    sample_points: 64
    backward_range_m: 20.0
    forward_range_m: 180.0
    include_connected_road_segments: true
    search_lateral_range_m: 40.0
