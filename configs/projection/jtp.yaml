# TRACE Joint Trajectory Projection (JTP): constraints, solver, and live context.
# Provisional values: calibrate only after the projection mechanism is frozen.
execution:
  dt_s: 0.1
  horizon_steps: 40
  control_steps: 40
  wheelbase_m: 5.5

stability:
  gravity_mps2: 9.81
  minimum_mu_for_limits: 0.05
  yaw_rate_safety_factor: 0.85
  minimum_speed_for_yaw_limit_mps: 3.0
  sideslip:
    base_limit_deg: 5.0
    reference_mu: 0.8
    friction_exponent: 0.5
    scale_min: 0.65
    scale_max: 1.15
  roll:
    base_limit_deg: 5.0
    reference_mu: 0.8
    friction_exponent: 0.5
    payload_reference_kg: 10000.0
    payload_sensitivity: 0.20
    scale_min: 0.55
    scale_max: 1.10
  ltr_limit: 0.6

geometry:
  curvature_limit_per_m: 0.25
  road_clearance_m: 0.35
  footprint:
    circle_offsets_m: [-3.0, -1.5, 0.0, 1.5, 3.0]
    circle_radius_m: 1.45

control:
  acceleration_min_mps2: -4.0
  acceleration_max_mps2: 2.5
  steering_min_rad: -0.61  # -35°
  steering_max_rad: 0.61  # 35°
  # Characteristic scales used to normalize control-space updates.
  trust_scale: [2.5, 0.08]

optimization:
  control_weights: [0.16, 156.25]

projection:
  qp:
    backend: osqp
    control_correction_weight: 1.0
    state_slack:
      linear_penalty: 10.0
      quadratic_penalty: 1.0
      bounds:
        yaw: [0.0, 0.01]      # rad/s
        sideslip: [0.0, 0.01] # rad
        roll: [0.0, 0.01]     # rad
        ltr: [0.0, 0.01]      # dimensionless
    eps_abs: 0.001
    eps_rel: 0.001
    max_iter: 20000
    time_limit_ms: 50.0
    polishing: true
    adaptive_rho: true
    verbose: false
  constraint_sampling_stride: 4
  nondegradation_tolerance: 1.0e-06
  max_iterations: 10
  max_stalled_iterations: 3
  constraint_tolerance: 0.0001
  alpha_initial: 1.0
  alpha_minimum: 0.0625
  alpha_shrink_factor: 0.5
  minimum_violation_improvement: 1.0e-06
  change_tolerance: 1.0e-06
  residual_scales:
    stability:
    - 0.5
    - 0.0872665
    - 0.0872665
    - 0.8

# Online K2 history construction.
runtime:
  context:
    sample_dt_s: 0.1
    max_gap_tolerance_s: 0.02
    history_state_steps: 5
    payload_kg: null       # scalar or per-controlled-vehicle list
    road_mu: null          # scalar or per-controlled-vehicle list, in (0,1]
