# TRACE Koopman truck collection V4: payload x friction x initial-speed grid.
# All .sim/.dll paths are placeholders. Confirm in TruckSim before enabling.
# Native: throttle [%], brake [MPa], steering wheel [deg].
# TruckSim exports: ax/ay [g], vx/vy [km/h], angles [deg], angular velocity [deg/s],
# AV_Eng [rpm], loads [N]. Internally save training states and references in SI.
trucksim:
  payload_tiers_kg: {L0: 5000.0, L1: 8000.0}  # example ADDITIONAL payloads; edit
  friction_tiers: {MU08: 0.8, MU05: 0.5}    # example, edit
  speed_tiers_kmh: {V60: 60.0, V80: 80.0} # first verification: two initial-speed tiers
  initial_speed_tolerance_kmh: 2.0        # check actual initial vx after TruckSim start
  # Each enabled (payload_tier, friction_tier, speed_tier) needs separate .sim and .dll.
  # Python sets initial SV_VXS using the mapped speed; load and road_mu are
  # manually set in the corresponding TruckSim vehicle model.
  require_complete_grid: false
  models:
    - id: L0_MU08_V60
      enabled: true
      payload_tier: L0
      friction_tier: MU08
      speed_tier: V60
      simfile: 'D:\Users\Public\Documents\TruckSim2016.1_Data_now_using\L0_MU08_V60.sim'
      dll: 'D:\Users\Public\Documents\TruckSim2016.1_Data_now_using\Extensions\Multi_vehicle_lon_lat\L0_MU08_V60.dll'
      verified_in_trucksim: true
