output_space: control
trajectory:
  model:
    reg_head_type: gru
  training:
    dataset_root: outputs/expert_dataset/expert_trucksim_k2_50k_v1
    output_dir: outputs/diffusion_pretrain
    train_split: train
    val_split: val
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: auto
    max_epochs: 100
    max_steps: -1
    learning_rate: 0.0001
    weight_decay: 0.0001
    min_lr: 1.0e-06
    warmup_epochs: 3
    device: auto
    precision: auto
    grad_clip: 5.0
    check_val_every_n_epoch: 1
    log_every_n_steps: 10
    seed: 0
    dense_loss_enabled: false
    dense_loss_lambda_p: 0.0
    dense_loss_type: smooth_l1
    dense_loss_terminal_only: true
    dense_loss_weight_mode: terminal_constant
    dense_loss_terminal_timestep: 0
    dense_loss_terminal_weight: 1.0
    dense_loss_dense_dt: 0.1
control:
  anchors:
    strategy: fixed
    num_selected: 10
    bank_path: outputs/anchor_ablation/a0_fixed_control_anchors.npz
  model:
    reg_head_type: mlp
  dynamics:
    horizon_steps: 40
    dt: 0.1
    wheelbase_m: 5.5
    max_accel_mps2: 2.5
    max_steer_rad: 0.08
    num_train_timesteps: 1000
    inference_steps: 2
    inference_start_timestep: 8
    inference_noise_scale: 1.0
    position_scale_m: 10.0
    loss_position: 1.0
  training:
    dataset_root: outputs/expert_dataset/expert_trucksim_k2_anchor_pair_100k
    output_dir: outputs/anchor_ablation/A0_fixed
    train_split: train
    val_split: val
    batch_size: 64
    num_workers: 8
    max_epochs: 60
    lr: 0.0001
    weight_decay: 0.0001
    grad_clip: 1.0
    patience: 15
    device: auto
    seed: 0
  execution:
    model: koopman_k2
    checkpoint: outputs/koopman/checkpoints/v0/k2/best.pt
  losses:
    trajectory:
      type: paper_mse
      weight: 1.0
    ltr:
      weight: 0.0
      limit: 0.6
    fuel:
      weight: 200
      parameters:
        empty_mass_kg: 4455
        rolling_resistance: 0.007
        drag_coefficient: 0.6
        frontal_area_m2: 6.8
        drivetrain_efficiency: 0.86
        alpha0: 0.00156
        alpha1: 8.0e-05
        alpha2: 1.0e-08
        air_density_kg_m3: 1.225
        gravity_m_s2: 9.81
    progress:
      weight: 0.02
      minimum_progress_m: 60
runtime:
  device: auto
  deterministic_seed: 0
  checkpoint:
    trajectory: outputs/diffusion_pretrain/YOUR_TRAJECTORY_CHECKPOINT.pt
    control: outputs/anchor_ablation/A0_fixed/best.pt
  diffusion_spline_enabled: false
  diffusion_execution_enabled: false
