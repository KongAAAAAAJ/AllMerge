# TRACE A2 safety-scoring-only training (no expert trajectory labels).
# Uses raw episodes and the shared A1/A2 candidate generator for scene inputs.
dataset_root: outputs/expert_dataset/expert_trucksim_50k
output_dir: outputs/anchor_ablation/ckpt
train_split: train
val_split: val
# Raw cache: candidate/teacher arrays are precomputed once and memory-mapped.
batch_size: 16
num_workers: 4
prefetch_factor: 2
drop_last: false

# Candidate pools and deterministic safety labels are generated once and reused.
cache_dir: outputs/anchor_ablation/cache_A2
precompute_batch_size: 16
precompute_device: auto
max_samples: null
epochs: 30
lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
seed: 0
diffusion_config: configs/train/diffusion.yaml
model: {}
candidate_generation:
  config_path: configs/anchors/control_candidate_pool.yaml
top_r_fraction: 0.5555556
trajectory_weight: 1.0
control_weight: 1.0
temperature: 0.3
teacher:
  collision_weight: 1.0
  road_weight: 1.0
  ego_length_m: 8.0
  ego_width_m: 2.6
  longitudinal_margin_m: 1.0
  lateral_margin_m: 0.3
  dt: 0.5
