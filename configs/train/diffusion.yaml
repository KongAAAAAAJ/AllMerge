# TRACE safety-aware control-space diffusion with frozen Koopman K2.
# Experiment YAMLs under ablation/ inherit this file with extends.
output_space: control

control:
  # Default A1 baseline. A0/A2 experiments override this block via extends.
  anchors:
    strategy: a1
    a1_config: configs/anchors/a1.yaml
  model:
    reg_head_type: mlp
    num_modes: 10
  dynamics:
    horizon_steps: 40
    dt: 0.1
    wheelbase_m: 5.5
    max_accel_mps2: 2.5
    max_steer_rad: 0.08
    num_train_timesteps: 1000
    inference_steps: 2
    inference_start_timestep: 8
    inference_noise_scale: 1.0
  training:
    trajectory_source: polynomial
    dataset_root: outputs/expert_dataset/expert_trucksim_dual_raw_100k_v3
    output_dir: outputs/anchor_ablation/safety_diffusion_ckpt/A1
    train_split: train
    val_split: val
    batch_size: 64
    num_workers: 8
    max_epochs: 60
    lr: 0.0001
    weight_decay: 0.0001
    grad_clip: 1.0
    patience: 15
    device: auto
    seed: 0
  execution:
    model: koopman_k2
    checkpoint: outputs/koopman/checkpoints/v0/k2/best.pt
  losses:
    # Keep inference-compatible mode selection identical across both objectives.
    mode_selection: goal_endpoint
    # Shared objective switch inherited by A0/A2 through `extends`.
    # goal_endpoint: original expert/safety/fuel/progress objective.
    # anchor_consistent: paired frozen-K2 Anchor execution consistency and relative fuel.
    training_scheme: goal_endpoint
    anchor_consistency:
      # Applied only to valid modes other than the expert-assigned mode.
      # The expert-assigned mode is supervised by the expert trajectory loss.
      weight: 0.1
    trajectory:
      weight: 1.0
    background_collision:
      weight: 1.0
    intertruck_collision:
      weight: 1.0
    ttc:
      weight: 1.0
    road_boundary:
      weight: 1.0
    safety:
      vehicle_length_m: 8.0
      vehicle_width_m: 2.6
      collision_margin_m: 0.2
      ttc_threshold_s: 1.0
      softplus_temperature_m: 0.2
      collision_distance_scale_m: 1.0
      ttc_distance_scale_m: 5.0
      road_distance_scale_m: 1.0
    ltr:
      weight: 0.0
      limit: 0.6
    fuel:
      # Absolute fuel weight is used by goal_endpoint. The relative weight is
      # used by anchor_consistent and compares each mode against its own Anchor.
      weight: 200
      relative_weight: 0.1
      relative_epsilon: 1.0e-8
      parameters:
        empty_mass_kg: 4455
        rolling_resistance: 0.007
        drag_coefficient: 0.6
        frontal_area_m2: 6.8
        drivetrain_efficiency: 0.86
        alpha0: 0.00156
        alpha1: 0.00008
        alpha2: 0.00000001
        air_density_kg_m3: 1.225
        gravity_m_s2: 9.81
    progress:
      weight: 0.02
      minimum_progress_m: 60
runtime:
  device: auto
  deterministic_seed: 0
  # JTP is an inference-only post-diffusion projection; no denoiser retraining.
  jtp_enabled: false
  jtp_config: configs/projection/jtp.yaml
  jtp_control_execution_enabled: false
  checkpoint:
    control: outputs/anchor_ablation/safety_diffusion_ckpt/A1/best.pt
  diffusion_spline_enabled: false
  diffusion_execution_enabled: false



