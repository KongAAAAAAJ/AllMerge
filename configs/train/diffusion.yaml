# Common trajectory/control diffusion settings.
# Control defaults: dynamic anchors, frozen Koopman K2, paper MSE and fuel/progress losses.
# Experiment YAMLs under ablation/ inherit this file with extends.
output_space: control

trajectory:
  model:
    reg_head_type: gru
  training:
    dataset_root: outputs/expert_dataset/expert_trucksim_k2_anchor_pair_100k
    output_dir: outputs/final_compare/trajectory_v0
    train_split: train
    val_split: val
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: auto
    max_epochs: 100
    max_steps: -1
    learning_rate: 0.0001
    weight_decay: 0.0001
    min_lr: 1.0e-06
    warmup_epochs: 3
    device: auto
    precision: auto
    grad_clip: 5.0
    check_val_every_n_epoch: 1
    log_every_n_steps: 10
    seed: 0
    dense_loss_enabled: false
    dense_loss_lambda_p: 0.0
    dense_loss_type: smooth_l1
    dense_loss_terminal_only: true
    dense_loss_weight_mode: terminal_constant
    dense_loss_terminal_timestep: 0
    dense_loss_terminal_weight: 1.0
    dense_loss_dense_dt: 0.1
control:
  # TRACE A2 is opt-in; A1 remains unchanged during expert data collection.
  anchors:
    strategy: dynamic
    top_r: 20
    trajectory_weight: 1.0
    control_weight: 1.0
    scorer_checkpoint: outputs/trace_adaptive_anchors/best.pt
  model:
    reg_head_type: mlp
    num_modes: 20
  dynamics:
    horizon_steps: 40
    dt: 0.1
    wheelbase_m: 5.5
    max_accel_mps2: 2.5
    max_steer_rad: 0.08
    num_train_timesteps: 1000
    inference_steps: 2
    inference_start_timestep: 8
    inference_noise_scale: 1.0
    position_scale_m: 10.0
    loss_position: 1.0
  training:
    dataset_root: outputs/expert_dataset/expert_trucksim_k2_anchor_pair_100k
    output_dir: outputs/final_compare/control_v0
    train_split: train
    val_split: val
    batch_size: 64
    num_workers: 8
    max_epochs: 60
    lr: 0.0001
    weight_decay: 0.0001
    grad_clip: 1.0
    patience: 15
    device: auto
    seed: 0
  execution:
    model: koopman_k2
    checkpoint: outputs/koopman/checkpoints/v0/k2/best.pt
  losses:
    trajectory:
      type: paper_mse
      weight: 1.0
    ltr:
      weight: 0.0
      limit: 0.6  # 侧倾风险阈值，超过0.6才参与loss计算
    fuel:
      weight: 200
      parameters:
        empty_mass_kg: 4455
        rolling_resistance: 0.007
        drag_coefficient: 0.6
        frontal_area_m2: 6.8
        drivetrain_efficiency: 0.86
        alpha0: 0.00156  # 经验值
        alpha1: 0.00008
        alpha2: 0.00000001
        air_density_kg_m3: 1.225
        gravity_m_s2: 9.81
    progress:
      weight: 0.02
      minimum_progress_m: 60  # 4s的平均进度
runtime:
  device: auto
  deterministic_seed: 0
  # JTP is an inference-only post-diffusion projection; no denoiser retraining.
  jtp_enabled: false
  jtp_config: configs/projection/jtp.yaml
  jtp_control_execution_enabled: false
  checkpoint:
    trajectory: outputs/diffusion_pretrain/run_1/checkpoints/best.pt
    control: outputs/fuel_ablation/F0/best.pt
  diffusion_spline_enabled: false
  diffusion_execution_enabled: false



