# AllMerge W2 diffusion pretraining configuration.
# The planner architecture is already owned by highway_env/planner/diffusion/.
# Keep this section empty unless intentionally overriding StructuredDiffusionConfig.
model: {}

training:
  dataset_root: data/expert/allmerge_planner_v1
  output_dir: outputs/diffusion_pretrain
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: auto
  cache_shards: 2
  max_epochs: 50
  max_steps: -1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  min_lr: 1.0e-6
  warmup_epochs: 3
  precision: auto
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  save_top_k: 3
  seed: 0
